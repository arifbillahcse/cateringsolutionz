<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Section — Catering Solutionz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    .cs-hero {
      position: relative;
      height: 100vh;
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }

    /* ── YouTube iframe cover ── */
    .cs-hero__yt {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .cs-hero__yt iframe {
      position: absolute;
      top: 50%; left: 50%;
      width: 100vw;
      height: 56.25vw;   /* 16:9 */
      min-height: 100vh;
      min-width: 177.78vh;
      transform: translate(-50%, -50%);
      border: 0;
      pointer-events: none;
    }

    /* ── Black overlay ── */
    .cs-hero__overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: rgba(0, 0, 0, 0.65);
    }

    /* ── Content ── */
    .cs-hero__content {
      position: relative;
      z-index: 2;
      text-align: center;
      color: #fff;
      padding: 0 20px;
      max-width: 860px;
      width: 100%;
    }

    .cs-hero__title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 8vw, 6rem);
      font-weight: 800;
      line-height: 1.05;
      margin-bottom: 18px;
      opacity: 0;
      transform: translateY(32px);
      animation: csUp 0.9s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .cs-hero__slogan {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-weight: 300;
      color: #00c3ff;
      letter-spacing: 1px;
      margin-bottom: 44px;
      opacity: 0;
      transform: translateY(24px);
      animation: csUp 0.9s 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .cs-hero__btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 38px;
      background: linear-gradient(135deg, #00c3ff, #00d9ff);
      color: #0e1b33;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 12px 32px rgba(0, 195, 255, 0.45);
      opacity: 0;
      transform: translateY(20px);
      animation: csUp 0.9s 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .cs-hero__btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 44px rgba(0, 195, 255, 0.6);
    }
    .cs-hero__btn i { transition: transform 0.3s ease; }
    .cs-hero__btn:hover i { transform: translateX(5px); }

    @keyframes csUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Scroll indicator ── */
    .cs-hero__scroll {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.6);
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      animation: csUp 1s 1.2s ease forwards;
    }
    .cs-hero__mouse {
      width: 22px; height: 36px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      padding-top: 5px;
    }
    .cs-hero__wheel {
      width: 3px; height: 7px;
      background: #d4a54f;
      border-radius: 3px;
      animation: csWheel 1.6s ease-in-out infinite;
    }
    @keyframes csWheel {
      0%   { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(11px); }
    }
  </style>
</head>
<body>

  <section class="cs-hero">

    <!-- YouTube video background -->
    <div class="cs-hero__yt">
      <div id="csYtPlayer"></div>
    </div>

    <!-- Dark overlay -->
    <div class="cs-hero__overlay"></div>

    <!-- Text content -->
    <div class="cs-hero__content">
      <h1 class="cs-hero__title">Catering Solution</h1>
      <p class="cs-hero__slogan">We lead the way others follow.</p>
      <a href="#shop" class="cs-hero__btn">
        Shop Now <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>

    <!-- Scroll indicator -->
    <div class="cs-hero__scroll">
      <div class="cs-hero__mouse"><span class="cs-hero__wheel"></span></div>
      <span>Scroll</span>
    </div>

  </section>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    function onYouTubeIframeAPIReady() {
      new YT.Player('csYtPlayer', {
        videoId: 'eYSHaYD1fY4',
        playerVars: {
          autoplay:        1,
          mute:            1,
          loop:            1,
          playlist:        'eYSHaYD1fY4',
          controls:        0,
          showinfo:        0,
          rel:             0,
          iv_load_policy:  3,
          modestbranding:  1,
          start:           5
        },
        events: {
          onReady: e => e.target.playVideo()
        }
      });
    }
  </script>

</body>
</html>
