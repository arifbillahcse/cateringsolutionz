<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Section — Catering Solutionz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Cabin:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    .cs-hero {
      position: relative;
      height: 100vh;
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Cabin', sans-serif;
    }

    /* ── YouTube iframe cover ── */
    .cs-hero__yt {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .cs-hero__yt iframe {
      position: absolute;
      top: 50%; left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.78vh;
      transform: translate(-50%, -50%);
      border: 0;
      pointer-events: none;
    }

    /* ── Dark overlay ── */
    .cs-hero__overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: rgba(0, 0, 0, 0.62);
    }

    /* ── Floating Icons ── */
    .cs-hero__icons {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .cs-fi {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0, 195, 255, 0.10);
      border: 1.5px solid rgba(0, 195, 255, 0.30);
      backdrop-filter: blur(6px);
      color: #00c3ff;
      opacity: 0;
    }

    /* Individual icon positions, sizes, and animations with random movement */
    .cs-fi:nth-child(1) { width:70px; height:70px; font-size:1.7rem; top:12%; left:7%;    animation: move1 10s ease-in-out 0.0s infinite; }
    .cs-fi:nth-child(2) { width:78px; height:78px; font-size:1.9rem; top:16%; right:9%;   animation: move2 11s ease-in-out 0.8s infinite; }
    .cs-fi:nth-child(3) { width:65px; height:65px; font-size:1.5rem; bottom:24%; left:6%; animation: move3 12s ease-in-out 1.5s infinite; }
    .cs-fi:nth-child(4) { width:72px; height:72px; font-size:1.7rem; top:42%; right:5%;   animation: move4 10.5s ease-in-out 0.5s infinite; }
    .cs-fi:nth-child(5) { width:62px; height:62px; font-size:1.4rem; bottom:20%; right:8%;animation: move5 11.5s ease-in-out 2.0s infinite; }
    .cs-fi:nth-child(6) { width:68px; height:68px; font-size:1.6rem; top:58%; left:4%;    animation: move6 12.5s ease-in-out 1.2s infinite; }
    .cs-fi:nth-child(7) { width:58px; height:58px; font-size:1.3rem; top:26%; left:20%;   animation: move1 11s ease-in-out 2.0s infinite; }
    .cs-fi:nth-child(8) { width:60px; height:60px; font-size:1.4rem; bottom:16%; right:20%;animation: move2 10.5s ease-in-out 2.5s infinite; }
    .cs-fi:nth-child(9) { width:66px; height:66px; font-size:1.6rem; top:35%; left:15%;   animation: move3 11.5s ease-in-out 0.3s infinite; }
    .cs-fi:nth-child(10) { width:64px; height:64px; font-size:1.5rem; top:48%; right:18%; animation: move4 10.8s ease-in-out 1.8s infinite; }
    .cs-fi:nth-child(11) { width:70px; height:70px; font-size:1.7rem; bottom:30%; left:18%;animation: move5 12s ease-in-out 2.2s infinite; }
    .cs-fi:nth-child(12) { width:62px; height:62px; font-size:1.4rem; top:20%; left:45%;   animation: move6 11.2s ease-in-out 0.6s infinite; }
    .cs-fi:nth-child(13) { width:68px; height:68px; font-size:1.6rem; bottom:35%; right:15%;animation: move1 10.5s ease-in-out 3.0s infinite; }
    .cs-fi:nth-child(14) { width:60px; height:60px; font-size:1.4rem; top:55%; right:25%; animation: move2 11.8s ease-in-out 1.4s infinite; }
    .cs-fi:nth-child(15) { width:72px; height:72px; font-size:1.7rem; top:8%; right:30%;  animation: move3 12.2s ease-in-out 2.8s infinite; }

    @keyframes csFloat {
      0%, 100% {
        opacity: 0.55;
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      50% {
        opacity: 0.9;
        transform: translateY(-26px) rotate(8deg) scale(1.08);
      }
    }

    /* Random movement animations for each icon */
    @keyframes move1 {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.55; }
      25% { transform: translate(40px, -60px) rotate(10deg) scale(1.1); opacity: 0.85; }
      50% { transform: translate(20px, -100px) rotate(5deg) scale(0.95); opacity: 0.9; }
      75% { transform: translate(-30px, -50px) rotate(-8deg) scale(1.05); opacity: 0.7; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.55; }
    }

    @keyframes move2 {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.55; }
      25% { transform: translate(-50px, -80px) rotate(-12deg) scale(0.95); opacity: 0.8; }
      50% { transform: translate(-20px, -120px) rotate(8deg) scale(1.12); opacity: 0.9; }
      75% { transform: translate(35px, -40px) rotate(3deg) scale(1); opacity: 0.65; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.55; }
    }

    @keyframes move3 {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.55; }
      25% { transform: translate(30px, -70px) rotate(15deg) scale(1.08); opacity: 0.9; }
      50% { transform: translate(-40px, -110px) rotate(-5deg) scale(0.98); opacity: 0.75; }
      75% { transform: translate(-15px, -50px) rotate(12deg) scale(1.1); opacity: 0.8; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.55; }
    }

    @keyframes move4 {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.55; }
      25% { transform: translate(-45px, -85px) rotate(-15deg) scale(1.05); opacity: 0.85; }
      50% { transform: translate(25px, -95px) rotate(10deg) scale(1.1); opacity: 0.9; }
      75% { transform: translate(40px, -60px) rotate(-8deg) scale(0.95); opacity: 0.7; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.55; }
    }

    @keyframes move5 {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.55; }
      25% { transform: translate(50px, -70px) rotate(8deg) scale(1.08); opacity: 0.8; }
      50% { transform: translate(-35px, -130px) rotate(-12deg) scale(0.92); opacity: 0.9; }
      75% { transform: translate(-20px, -45px) rotate(6deg) scale(1.12); opacity: 0.75; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.55; }
    }

    @keyframes move6 {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.55; }
      25% { transform: translate(-55px, -75px) rotate(12deg) scale(1.1); opacity: 0.85; }
      50% { transform: translate(45px, -105px) rotate(-8deg) scale(0.98); opacity: 0.9; }
      75% { transform: translate(15px, -55px) rotate(10deg) scale(1.05); opacity: 0.7; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.55; }
    }

    /* ── Content ── */
    .cs-hero__content {
      position: relative;
      z-index: 3;
      text-align: center;
      color: #fff;
      padding: 0 20px;
      max-width: 860px;
      width: 100%;
    }

    .cs-hero__title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 8vw, 6rem);
      font-weight: 800;
      line-height: 1.05;
      margin-bottom: 18px;
      opacity: 0;
      transform: translateY(32px);
      animation: csUp 0.9s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .cs-hero__slogan {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-weight: 400;
      color: #00c3ff;
      letter-spacing: 1px;
      margin-bottom: 44px;
      opacity: 0;
      transform: translateY(24px);
      animation: csUp 0.9s 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .cs-hero__btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 38px;
      background: linear-gradient(135deg, #00c3ff, #00d9ff);
      color: #092143;
      font-family: 'Cabin', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 12px 32px rgba(0, 195, 255, 0.45);
      opacity: 0;
      transform: translateY(20px);
      animation: csUp 0.9s 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .cs-hero__btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 44px rgba(0, 195, 255, 0.6);
    }
    .cs-hero__btn i { transition: transform 0.3s ease; }
    .cs-hero__btn:hover i { transform: translateX(5px); }

    @keyframes csUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Scroll indicator ── */
    .cs-hero__scroll {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.6);
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      animation: csUp 1s 1.2s ease forwards;
    }
    .cs-hero__mouse {
      width: 22px; height: 36px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      padding-top: 5px;
    }
    .cs-hero__wheel {
      width: 3px; height: 7px;
      background: #00c3ff;
      border-radius: 3px;
      animation: csWheel 1.6s ease-in-out infinite;
    }
    @keyframes csWheel {
      0%   { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(11px); }
    }

    @media (max-width: 768px) {
      .cs-fi { display: none; }
      .cs-fi:nth-child(1), .cs-fi:nth-child(2),
      .cs-fi:nth-child(3), .cs-fi:nth-child(4) { display: flex; width: 48px !important; height: 48px !important; font-size: 1.1rem !important; }
    }
  </style>
</head>
<body>

  <section class="cs-hero">

    <!-- YouTube video background -->
    <div class="cs-hero__yt">
      <div id="csYtPlayer"></div>
    </div>

    <!-- Dark overlay -->
    <div class="cs-hero__overlay"></div>

    <!-- Floating catering icons (above overlay, below content) -->
    <div class="cs-hero__icons">
      <div class="cs-fi"><i class="fa-solid fa-utensils"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-bowl-food"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-fire-burner"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-kitchen-set"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-truck-fast"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-wine-glass"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-pot-food"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-plate-wheat"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-cheese"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-martini-glass-citrus"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-champagne-glass"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-cloche"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-spoon"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-fork-knife"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-person-chefs-hat"></i></div>
    </div>

    <!-- Text content -->
    <div class="cs-hero__content">
      <h1 class="cs-hero__title">Catering Solutionz</h1>
      <p class="cs-hero__slogan">We lead the way others follow.</p>
      <a href="#shop" class="cs-hero__btn">
        Shop Now <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>

    <!-- Scroll indicator -->
    <div class="cs-hero__scroll">
      <div class="cs-hero__mouse"><span class="cs-hero__wheel"></span></div>
      <span>Scroll</span>
    </div>

  </section>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    function onYouTubeIframeAPIReady() {
      new YT.Player('csYtPlayer', {
        videoId: 'hKj4RG1ugB8',
        playerVars: {
          autoplay:       1,
          mute:           1,
          loop:           1,
          playlist:       'hKj4RG1ugB8',
          controls:       0,
          showinfo:       0,
          rel:            0,
          iv_load_policy: 3,
          modestbranding: 1,
          start:          5
        },
        events: {
          onReady: e => e.target.playVideo()
        }
      });
    }
  </script>

</body>
</html>
