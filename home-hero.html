<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Section — Catering Solutionz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Cabin:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    .cs-hero {
      position: relative;
      height: 80vh;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Cabin', sans-serif;
    }

    /* ── YouTube iframe ── */
    .cs-hero__yt {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .cs-hero__yt iframe {
      position: absolute;
      top: 50%; left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.78vh;
      transform: translate(-50%, -50%);
      border: 0;
      pointer-events: none;
    }

    /* ── Dark overlay ── */
    .cs-hero__overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: rgba(0, 0, 0, 0.62);
    }

    /* ── Floating Icons container ── */
    .cs-hero__icons {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    /* Icon circles */
    .cs-fi {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: rgba(0, 195, 255, 0.10);
      border: 1.5px solid rgba(0, 195, 255, 0.30);
      backdrop-filter: blur(6px);
      color: #00c3ff;
      font-size: 1.6rem;
      opacity: 0;
      transition: transform 0.05s linear;
    }

    /* Logo floating element */
    .cs-fi-logo {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      width: 74px;
      height: 74px;
      padding: 10px;
    }
    .cs-fi-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1) drop-shadow(0 0 6px rgba(0,195,255,0.6));
    }

    /* ── Content ── */
    .cs-hero__content {
      position: relative;
      z-index: 3;
      text-align: center;
      color: #fff;
      padding: 0 20px;
      max-width: 860px;
      width: 100%;
    }

    .cs-hero__title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 8vw, 6rem);
      font-weight: 800;
      line-height: 1.05;
      margin-bottom: 18px;
      opacity: 0;
      transform: translateY(32px);
      animation: csUp 0.9s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .cs-hero__slogan {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-weight: 400;
      color: #00c3ff;
      letter-spacing: 1px;
      margin-bottom: 44px;
      opacity: 0;
      transform: translateY(24px);
      animation: csUp 0.9s 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .cs-hero__btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 38px;
      background: linear-gradient(135deg, #00c3ff, #00d9ff);
      color: #092143;
      font-family: 'Cabin', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 12px 32px rgba(0, 195, 255, 0.45);
      opacity: 0;
      transform: translateY(20px);
      animation: csUp 0.9s 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .cs-hero__btn:hover { transform: translateY(-4px); box-shadow: 0 18px 44px rgba(0, 195, 255, 0.6); }
    .cs-hero__btn i { transition: transform 0.3s ease; }
    .cs-hero__btn:hover i { transform: translateX(5px); }

    @keyframes csUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Scroll indicator ── */
    .cs-hero__scroll {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.6);
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      animation: csUp 1s 1.2s ease forwards;
    }
    .cs-hero__mouse {
      width: 22px; height: 36px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      padding-top: 5px;
    }
    .cs-hero__wheel {
      width: 3px; height: 7px;
      background: #00c3ff;
      border-radius: 3px;
      animation: csWheel 1.6s ease-in-out infinite;
    }
    @keyframes csWheel {
      0%   { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(11px); }
    }

    @media (max-width: 768px) {
      .cs-fi { width: 48px; height: 48px; font-size: 1.1rem; }
      .cs-fi-logo { width: 54px; height: 54px; }
    }
  </style>
</head>
<body>

  <section class="cs-hero">

    <!-- YouTube video background -->
    <div class="cs-hero__yt">
      <div id="csYtPlayer"></div>
    </div>

    <!-- Dark overlay -->
    <div class="cs-hero__overlay"></div>

    <!-- Floating icons -->
    <div class="cs-hero__icons" id="csIcons">
      <!-- Catering icons (valid FA6 names) -->
      <div class="cs-fi"><i class="fa-solid fa-utensils"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-bowl-food"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-fire-burner"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-kitchen-set"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-truck-fast"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-wine-glass"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-mug-hot"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-plate-wheat"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-cheese"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-martini-glass-citrus"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-champagne-glasses"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-bell-concierge"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-spoon"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-blender"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-pepper-hot"></i></div>
      <!-- Website logo floating -->
      <div class="cs-fi cs-fi-logo">
        <img src="https://cateringsolutionz.com/wp-content/uploads/2026/06/logo-ony.png" alt="Catering Solutionz" />
      </div>
    </div>

    <!-- Text content -->
    <div class="cs-hero__content">
      <h1 class="cs-hero__title">Catering Solutionz</h1>
      <p class="cs-hero__slogan">We lead the way others follow.</p>
      <a href="#shop" class="cs-hero__btn">
        Shop Now <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>

    <!-- Scroll indicator -->
    <div class="cs-hero__scroll">
      <div class="cs-hero__mouse"><span class="cs-hero__wheel"></span></div>
      <span>Scroll</span>
    </div>

  </section>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    /* ── YouTube Player ── */
    function onYouTubeIframeAPIReady() {
      new YT.Player('csYtPlayer', {
        videoId: 'hKj4RG1ugB8',
        playerVars: {
          autoplay: 1, mute: 1, loop: 1,
          playlist: 'hKj4RG1ugB8', controls: 0,
          showinfo: 0, rel: 0, iv_load_policy: 3,
          modestbranding: 1, start: 5
        },
        events: { onReady: e => e.target.playVideo() }
      });
    }

    /* ── Random drift animation ── */
    (function () {
      const section = document.querySelector('.cs-hero');
      const icons   = Array.from(document.querySelectorAll('.cs-fi'));
      const isMobile = () => window.innerWidth <= 768;

      const state = icons.map(() => {
        const W = section.offsetWidth;
        const H = section.offsetHeight;
        const size = isMobile() ? 48 : 66;
        const margin = 10;
        return {
          x:  margin + Math.random() * (W - size - margin * 2),
          y:  margin + Math.random() * (H - size - margin * 2),
          tx: 0, ty: 0,
          vx: 0, vy: 0,
          angle: Math.random() * 360,
          angleDelta: (Math.random() - 0.5) * 0.3,
          speed: 0.25 + Math.random() * 0.35
        };
      });

      /* Assign random target within safe bounds */
      function newTarget(s) {
        const W = section.offsetWidth;
        const H = section.offsetHeight;
        const size = isMobile() ? 48 : 66;
        const margin = 10;
        s.tx = margin + Math.random() * (W - size - margin * 2);
        s.ty = margin + Math.random() * (H - size - margin * 2);
      }

      state.forEach(s => newTarget(s));

      /* Fade icons in */
      setTimeout(() => {
        icons.forEach((el, i) => {
          el.style.transition = 'opacity 1.2s ease';
          el.style.opacity    = '0.65';
          el.style.left = state[i].x + 'px';
          el.style.top  = state[i].y + 'px';
          el.style.position = 'absolute';
        });
      }, 300);

      /* Animation loop — lerp position toward target */
      function tick() {
        const W = section.offsetWidth;
        const H = section.offsetHeight;

        state.forEach((s, i) => {
          const dx = s.tx - s.x;
          const dy = s.ty - s.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          /* Pick a new target when close enough */
          if (dist < 4) newTarget(s);

          /* Smooth lerp toward target */
          s.x += dx * s.speed * 0.012;
          s.y += dy * s.speed * 0.012;

          /* Gentle rotation */
          s.angle += s.angleDelta;

          icons[i].style.left      = s.x + 'px';
          icons[i].style.top       = s.y + 'px';
          icons[i].style.transform = `rotate(${s.angle}deg)`;
          icons[i].style.transition = 'none';
        });

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>

</body>
</html>
