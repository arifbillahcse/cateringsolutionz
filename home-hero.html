<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Section — Catering Solutionz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Cabin:wght@400;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    .cs-hero {
      position: relative;
      height: 80vh;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Cabin', sans-serif;
    }

    /* ── YouTube iframe ── */
    .cs-hero__yt {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.95;
    }
    .cs-hero__yt iframe {
      position: absolute;
      top: 50%; left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.78vh;
      transform: translate(-50%, -50%);
      border: 0;
      pointer-events: none !important;
      display: block;
      filter: brightness(0.9) contrast(1.1);
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* Hide YouTube controls - overlay entire iframe */
    .cs-hero__yt::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      background: transparent;
      border: none;
      box-shadow: inset 0 0 0 9999px transparent;
    }

    /* Block YouTube UI elements with dark overlay */
    .cs-hero__yt::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      z-index: 9;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.7));
    }

    /* ── Dark overlay ── */
    .cs-hero__overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: rgba(0, 0, 0, 0.62);
      pointer-events: none;
    }

    /* Control blocker overlay - covers bottom area where YT controls appear */
    .cs-hero__overlay::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 150px;
      background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.95));
      z-index: 20;
    }

    /* ── Floating Icons container ── */
    .cs-hero__icons {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    /* Icon circles */
    .cs-fi {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: rgba(0, 195, 255, 0.10);
      border: 1.5px solid rgba(0, 195, 255, 0.30);
      backdrop-filter: blur(6px);
      color: #00c3ff;
      font-size: 1.6rem;
      opacity: 0;
      transition: transform 0.05s linear;
    }

    /* Logo floating element */
    .cs-fi-logo {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      width: 74px;
      height: 74px;
      padding: 10px;
    }
    .cs-fi-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1) drop-shadow(0 0 6px rgba(0,195,255,0.6));
    }

    /* ── Content ── */
    .cs-hero__content {
      position: relative;
      z-index: 3;
      text-align: center;
      color: #fff;
      padding: 0 20px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cs-hero__title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2.8rem, 8vw, 6rem);
      font-weight: 800;
      line-height: 1.05;
      color: #ffffff;
      margin-bottom: 18px;
      opacity: 0;
      transform: translateY(32px);
      animation: csUp 0.9s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      white-space: nowrap;
      display: inline-block;
    }

    .cs-hero__title-highlight {
      color: #00C8FF;
    }

    .cs-hero__slogan {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-weight: 600;
      color: #00c3ff;
      letter-spacing: 1px;
      margin-bottom: 44px;
      opacity: 0;
      transform: translateY(24px);
      animation: csUp 0.9s 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .cs-hero__btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 38px;
      background: linear-gradient(135deg, #00c3ff, #00d9ff);
      color: #092143;
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 12px 32px rgba(0, 195, 255, 0.45);
      opacity: 0;
      transform: translateY(20px);
      animation: csUp 0.9s 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .cs-hero__btn:hover { transform: translateY(-4px); box-shadow: 0 18px 44px rgba(0, 195, 255, 0.6); }
    .cs-hero__btn i { transition: transform 0.3s ease; }
    .cs-hero__btn:hover i { transform: translateX(5px); }

    @keyframes csUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .cs-fi { width: 48px; height: 48px; font-size: 1.1rem; }
      .cs-fi-logo { width: 54px; height: 54px; }
    }
  </style>
</head>
<body>

  <section class="cs-hero">

    <!-- YouTube video background -->
    <div class="cs-hero__yt">
      <div id="csYtPlayer"></div>
    </div>

    <!-- Dark overlay -->
    <div class="cs-hero__overlay"></div>

    <!-- Floating icons -->
    <div class="cs-hero__icons" id="csIcons">
      <!-- Catering icons (valid FA6 names) -->
      <div class="cs-fi"><i class="fa-solid fa-utensils"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-bowl-food"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-fire-burner"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-kitchen-set"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-truck-fast"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-wine-glass"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-mug-hot"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-plate-wheat"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-cheese"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-martini-glass-citrus"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-champagne-glasses"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-bell-concierge"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-spoon"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-blender"></i></div>
      <div class="cs-fi"><i class="fa-solid fa-pepper-hot"></i></div>
      <!-- Website logo floating -->
      <div class="cs-fi cs-fi-logo">
        <img src="https://cateringsolutionz.com/wp-content/uploads/2026/06/logo-ony.png" alt="Catering Solutionz" />
      </div>
    </div>

    <!-- Text content -->
    <div class="cs-hero__content">
      <h1 class="cs-hero__title">Catering <span class="cs-hero__title-highlight">Solutionz</span></h1>
      <p class="cs-hero__slogan">We lead the way others follow.</p>
      <a href="#shop" class="cs-hero__btn">
        Shop Now <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>

  </section>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    /* ── YouTube Player ── */
    function onYouTubeIframeAPIReady() {
      const player = new YT.Player('csYtPlayer', {
        videoId: 'hKj4RG1ugB8',
        playerVars: {
          autoplay:       1,
          mute:           1,
          loop:           1,
          playlist:       'hKj4RG1ugB8',
          controls:       0,
          showinfo:       0,
          rel:            0,
          iv_load_policy: 3,
          modestbranding: 0,
          start:          5,
          fs:             0,
          disablekb:      1,
          cc_load_policy: 0,
          html5:          1,
          playsinline:    1,
          widget_referrer: ''
        },
        events: {
          onReady: function(e) {
            e.target.setVolume(0);
            setTimeout(() => {
              e.target.playVideo();
            }, 500);
          },
          onError: function(e) {
            console.error('YouTube player error:', e.data);
          }
        }
      });

      // Aggressively hide YouTube UI elements
      const iframe = document.querySelector('#csYtPlayer');
      if (iframe) {
        iframe.style.cssText = `
          pointer-events: none !important;
          z-index: 0 !important;
          -webkit-user-select: none !important;
          -webkit-touch-callout: none !important;
          user-select: none !important;
        `;

        // Disable all event listeners
        iframe.parentElement.style.pointerEvents = 'none';

        // Clip off the bottom where controls appear
        const parent = document.querySelector('.cs-hero__yt');
        if (parent) {
          parent.style.clipPath = 'polygon(0 0, 100% 0, 100% 100%, 0 100%)';
        }
      }
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        const player = document.querySelector('iframe[src*="youtube"]');
        if (player && window.YT && window.YT.Player) {
          const ytPlayer = player.parentElement.querySelector('iframe');
          if (ytPlayer) {
            // Force play if autoplay didn't work
            try {
              const playButton = document.querySelector('iframe');
              if (playButton) {
                ytPlayer.style.display = 'block';
              }
            } catch(e) {
              console.log('Autoplay initiated');
            }
          }
        }
      }, 1000);
    });

    /* ── Random drift animation ── */
    (function () {
      const section = document.querySelector('.cs-hero');
      const icons   = Array.from(document.querySelectorAll('.cs-fi'));
      const isMobile = () => window.innerWidth <= 768;

      const state = icons.map(() => {
        const W = section.offsetWidth;
        const H = section.offsetHeight;
        const size = isMobile() ? 48 : 66;
        const margin = 10;
        return {
          x:  margin + Math.random() * (W - size - margin * 2),
          y:  margin + Math.random() * (H - size - margin * 2),
          tx: 0, ty: 0,
          vx: 0, vy: 0,
          angle: Math.random() * 360,
          angleDelta: (Math.random() - 0.5) * 0.3,
          speed: 0.25 + Math.random() * 0.35
        };
      });

      /* Assign random target within safe bounds */
      function newTarget(s) {
        const W = section.offsetWidth;
        const H = section.offsetHeight;
        const size = isMobile() ? 48 : 66;
        const margin = 10;
        s.tx = margin + Math.random() * (W - size - margin * 2);
        s.ty = margin + Math.random() * (H - size - margin * 2);
      }

      state.forEach(s => newTarget(s));

      /* Fade icons in */
      setTimeout(() => {
        icons.forEach((el, i) => {
          el.style.transition = 'opacity 1.2s ease';
          el.style.opacity    = '0.65';
          el.style.left = state[i].x + 'px';
          el.style.top  = state[i].y + 'px';
          el.style.position = 'absolute';
        });
      }, 300);

      /* Animation loop — lerp position toward target */
      function tick() {
        const W = section.offsetWidth;
        const H = section.offsetHeight;

        state.forEach((s, i) => {
          const dx = s.tx - s.x;
          const dy = s.ty - s.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          /* Pick a new target when close enough */
          if (dist < 4) newTarget(s);

          /* Smooth lerp toward target */
          s.x += dx * s.speed * 0.012;
          s.y += dy * s.speed * 0.012;

          /* Gentle rotation */
          s.angle += s.angleDelta;

          icons[i].style.left      = s.x + 'px';
          icons[i].style.top       = s.y + 'px';
          icons[i].style.transform = `rotate(${s.angle}deg)`;
          icons[i].style.transition = 'none';
        });

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>

</body>
</html>
